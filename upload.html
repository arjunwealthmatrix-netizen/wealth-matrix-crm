<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Documents — Wealth Matrix Finserv</title>
<style>
:root{
  --bg:#000000; --s1:#111111; --s2:#1A1A1A; --border:#2A2A2A;
  --accent:#1D6FE0; --accent2:rgba(29,111,224,.12);
  --text:#FFFFFF; --t2:#AAAAAA; --t3:#666666;
  --green:#2ecc71; --r:12px; --r2:8px;
  --page-w:460px; --grid-cols:1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.wrap{max-width:var(--page-w);margin:0 auto;padding:0 0 40px;transition:max-width .2s}
.hdr{padding:22px 18px 16px;text-align:center;border-bottom:1px solid var(--border)}
.hdr .logo{font-size:34px;margin-bottom:6px}
.hdr h1{font-size:16px;font-weight:800;margin:0 0 4px}
.hdr p{font-size:11px;color:var(--t3);margin:0}
.state{padding:60px 24px;text-align:center}
.state .ico{font-size:40px;margin-bottom:14px}
.state h2{font-size:15px;font-weight:800;margin:0 0 8px}
.state p{font-size:12px;color:var(--t2);line-height:1.6;margin:0}
.greet{padding:18px;text-align:center}
.greet .name{font-size:17px;font-weight:800}
.greet .sub{font-size:11px;color:var(--t2);margin-top:4px;line-height:1.5}
.notice{margin:0 14px 14px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.consent-box{margin:0 14px 16px;background:var(--s1);border:1px solid var(--accent);border-radius:var(--r);padding:16px}
.consent-box .t{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:8px;line-height:1.4}
.consent-box p{font-size:12px;color:var(--t2);line-height:1.7;margin:0 0 12px}
.consent-check{display:flex;align-items:flex-start;gap:10px;cursor:pointer;-webkit-user-select:none;user-select:none}
.consent-check input[type=checkbox]{width:20px;height:20px;min-width:20px;margin-top:1px;accent-color:var(--accent);cursor:pointer}
.consent-check span{font-size:13px;font-weight:700;color:var(--text);line-height:1.4}
.notice .t{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.notice p{font-size:11px;color:var(--t2);line-height:1.6;margin:0 0 8px}
.notice p:last-child{margin-bottom:0}
.sectionlbl{padding:16px 14px 6px;font-size:11px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.slots{padding:6px 14px;display:grid;grid-template-columns:repeat(var(--grid-cols),1fr);gap:10px}
.slot{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.slot .l{flex:1;min-width:0}
.slot .l .t{font-size:14px;font-weight:700}
.slot .l .s{font-size:11px;color:var(--t3);margin-top:3px}
.slot .btn{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff !important;background:var(--accent);padding:9px 14px;border-radius:var(--r2);cursor:pointer;flex-shrink:0;text-align:center;border:none;-webkit-appearance:none;appearance:none;line-height:normal;min-width:64px}
.slot.done{border-color:var(--green)}
.slot.done .s{color:var(--green)}
.slot.err .s{color:#e74c3c}
.slot .btn.done{background:var(--s2);color:var(--green);border:1px solid var(--green)}
.form-block{margin:6px 14px 0;background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.fg{margin-bottom:12px}
.fg:last-child{margin-bottom:0}
.fl{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;display:block}
.fi{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:10px 12px;color:var(--text);font-family:inherit;font-size:14px;outline:none}
.fi:focus{border-color:var(--accent)}
.nomform-grid{display:grid;grid-template-columns:repeat(var(--grid-cols),1fr);gap:0 14px}
.savebtn{width:100%;padding:12px;font-size:13px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:var(--r2);cursor:pointer;margin-top:4px}
.savebtn:disabled{opacity:.5}
.savemsg{font-size:11px;margin-top:8px;text-align:center}
.savemsg.ok{color:var(--green)}
.savemsg.err{color:#e74c3c}
.footer-note{padding:18px 24px 4px;text-align:center;font-size:10px;color:var(--t3);line-height:1.6}
input[type=file]{display:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--t3);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── Adaptive breakpoints ── */
@media (min-width:700px){
  :root{ --page-w:640px; --grid-cols:2; }
  body{font-size:15px}
  .hdr{padding:30px 18px 20px}
  .hdr .logo{font-size:42px}
  .hdr h1{font-size:19px}
  .state{padding:90px 24px}
}
@media (min-width:1000px){
  :root{ --page-w:820px; --grid-cols:3; }
  .wrap{padding-top:24px}
  .hdr{border-radius:var(--r) var(--r) 0 0}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="logo">🔒</div>
    <h1>Wealth Matrix Finserv</h1>
    <p>Secure document upload</p>
  </div>
  <div id="app">
    <div class="state"><div class="spin" style="width:22px;height:22px"></div></div>
  </div>
</div>

<script>
// ── CONFIGURATION ── update this if you ever redeploy Apps Script with a new URL
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxi1b4DHWFsXuOCO5XTpsCPmhEawBDpC66eVZW7K1Z6aZ7zwLZ7HYhNd--saAv6CdG5/exec';

var DOC_TYPES = [
  {key:'PAN', label:'PAN'},
  {key:'Aadhaar', label:'Aadhaar'},
  {key:'Bank account details', label:'Bank account details (Account statement/Cancelled cheque)'},
  {key:'Passport', label:'Passport (only for NRIs)'},
  {key:'Resident ID', label:'Resident ID (only for NRIs)'}
];

var client = null; // {name, mobile, pan}

function qs(name){
  var p = new URLSearchParams(window.location.search);
  return p.get(name) || '';
}

function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

function fileToBase64(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result.split(',')[1]); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Same POST pattern as the main app — text/plain avoids CORS preflight
async function apiPost(data, timeoutMs){
  var controller = (typeof AbortController!=='undefined') ? new AbortController() : null;
  var timer = null;
  if(controller && timeoutMs){
    timer = setTimeout(function(){ controller.abort(); }, timeoutMs);
  }
  try{
    var r = await fetch(SCRIPT_URL, {
      method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(data),
      signal: controller ? controller.signal : undefined
    });
    if(timer) clearTimeout(timer);
    var t = await r.text();
    try{ return JSON.parse(t); } catch(e){ return r.ok ? {success:true} : {error:'Server returned an error (HTTP '+r.status+')'}; }
  }catch(e){
    if(timer) clearTimeout(timer);
    if(e.name==='AbortError') return {error:'Request timed out — the server took too long to respond'};
    // A genuine network-level failure (device offline, DNS/connectivity issue,
    // or — the most likely real-world cause of intermittent reports — the
    // Apps Script URL in this page no longer matches the live deployment,
    // e.g. after a "New deployment" was made instead of updating the existing one.
    return {error:'Could not reach the server — check your internet connection'};
  }
}

function renderError(title, msg){
  document.getElementById('app').innerHTML =
    '<div class="state"><div class="ico">⚠️</div><h2>'+title+'</h2><p>'+msg+'</p></div>';
}

function renderSlots(){
  var app = document.getElementById('app');
  var html = '<div class="greet"><div class="name">Hi '+esc(client.name||'there')+'</div>'
    + '<div class="sub">Please upload the documents below. Tap any item to choose a photo or PDF from your phone.</div></div>'
    + '<div class="notice">'
    +   '<div class="t">📋 Why we need these documents</div>'
    +   '<p>As per regulatory (KYC) requirements, please upload the documents below to complete your onboarding.</p>'
    + '</div>'
    + '<div class="sectionlbl">Documents</div>'
    + '<div class="slots" id="slotList">'
    + DOC_TYPES.map(function(dt){
        var safeId = dt.key.replace(/\s+/g,'_');
        var row = '<div class="slot" id="row-'+safeId+'">'
          + '<div class="l"><div class="t">'+dt.label+'</div><div class="s" id="status-'+safeId+'">Not uploaded</div></div>'
          + '<label class="btn" id="btn-'+safeId+'">Upload'
          + '<input type="file" accept="image/*,.pdf" data-doctype="'+dt.key+'" onchange="handleUpload(this)">'
          + '</label></div>';
        if(dt.key==='Bank account details'){
          row += '<div style="padding:6px 14px 4px;font-size:11px;color:var(--t2)">You may also provide the bank details below, along with your nominee details.</div>';
        }
        return row;
      }).join('')
    + '</div>'
    + '<div class="sectionlbl">Nominee &amp; Bank Details</div>'
    + '<div class="form-block">'
    +   '<div class="nomform-grid">'
    +     '<div class="fg"><label class="fl">Nominee Name</label><input class="fi" id="nom-name" placeholder="FULL NAME" oninput="this.value=this.value.toUpperCase()"></div>'
    +     '<div class="fg"><label class="fl">Nominee Mobile Number</label><input class="fi" id="nom-mobile" type="tel" inputmode="numeric" placeholder="10-digit mobile number" oninput="this.value=this.value.replace(/[^0-9]/g,\'\').slice(0,10)"></div>'
    +   '</div>'
    +   '<div class="fg"><label class="fl">Nominee Email ID</label><input class="fi" id="nom-email" type="email" placeholder="nominee@example.com"></div>'
    +   '<div class="fg"><label class="fl">Nominee KYC Document</label>'
    +     '<div class="slot" id="row-Nominee_KYC" style="margin-top:2px">'
    +       '<div class="l"><div class="t">Nominee ID Proof (PAN/Aadhaar/Driving License)</div><div class="s" id="status-Nominee_KYC">Not uploaded</div></div>'
    +       '<label class="btn" id="btn-Nominee_KYC">Upload'
    +       '<input type="file" accept="image/*,.pdf" data-doctype="Nominee KYC" onchange="handleUpload(this)">'
    +       '</label></div>'
    +   '</div>'
    +   '<div class="nomform-grid" style="margin-top:14px">'
    +     '<div class="fg"><label class="fl">Bank Account Number</label><input class="fi" id="bank-acc" inputmode="numeric" placeholder="Account number" oninput="this.value=this.value.replace(/[^0-9]/g,\'\')"></div>'
    +     '<div class="fg"><label class="fl">IFSC Code</label><input class="fi" id="bank-ifsc" placeholder="IFSC code" oninput="this.value=this.value.toUpperCase()"></div>'
    +   '</div>'
    +   '<button class="savebtn" id="nomSaveBtn" onclick="saveNominee()">Save Details</button>'
    +   '<div class="savemsg" id="nomMsg"></div>'
    + '</div>'
    + '<div class="footer-note">🔒 Documents are uploaded directly and securely to your advisor\'s private folder. No account or login needed.</div>';
  app.innerHTML = html;
}

// Checks the client's Drive folder for documents already uploaded — even from
// a previous visit to this same link — and marks those slots as done on load,
// so it's immediately clear which documents are still missing versus already in.
async function markExistingUploads(){
  if(!client || !client.folderId) return; // no folder yet means nothing could be uploaded yet
  try{
    var res = await apiPost({
      action:'listClientDocuments',
      clientName: client.name, pan: client.pan||'', mobile: client.mobile, folderId: client.folderId
    });
    if(!res || !res.success || !res.files) return;
    var uploadedTypes = {};
    res.files.forEach(function(f){ uploadedTypes[f.docType]=true; });
    DOC_TYPES.concat([{key:'Nominee KYC'}]).forEach(function(dt){
      if(!uploadedTypes[dt.key]) return; // not uploaded — leave the slot as "Not uploaded"
      var safeId = dt.key.replace(/\s+/g,'_');
      var statusEl = document.getElementById('status-'+safeId);
      var rowEl = document.getElementById('row-'+safeId);
      var btnEl = document.getElementById('btn-'+safeId);
      if(statusEl) statusEl.textContent = '✅ Uploaded';
      if(rowEl) rowEl.className = 'slot done';
      if(btnEl){
        var inputEl = btnEl.querySelector('input[type=file]');
        btnEl.textContent = 'Replace';
        btnEl.className = 'btn done';
        if(inputEl) btnEl.appendChild(inputEl);
      }
    });
  }catch(e){ /* non-fatal — worst case, slots just show "Not uploaded" until re-checked */ }
}

async function handleUpload(inputEl){
  var docType = inputEl.dataset.doctype;
  var file = inputEl.files[0];
  if(!file) return;
  var safeId = docType.replace(/\s+/g,'_');
  var statusEl = document.getElementById('status-'+safeId);
  var rowEl = document.getElementById('row-'+safeId);
  var btnEl = document.getElementById('btn-'+safeId);

  if(file.size > 10*1024*1024){
    if(statusEl){ statusEl.textContent = 'File too large — please keep it under 10MB'; }
    if(rowEl) rowEl.className = 'slot err';
    inputEl.value=''; return;
  }

  if(statusEl){ statusEl.innerHTML = '<span class="spin"></span>Uploading…'; }
  if(rowEl) rowEl.className = 'slot';

  try{
    var base64 = await fileToBase64(file);
    var ext = file.name.indexOf('.')>=0 ? file.name.split('.').pop() : '';
    var res = await apiPost({
      action:'uploadClientDocument',
      clientName: client.name, pan: client.pan||'', mobile: client.mobile, folderId: client.folderId||'',
      docType: docType, fileData: base64, mimeType: file.type, fileExt: ext
    }, 25000);
    if(res && res.success){
      if(statusEl) statusEl.textContent = '✅ Uploaded';
      if(rowEl) rowEl.className = 'slot done';
      if(btnEl){ btnEl.textContent = 'Replace'; btnEl.className='btn done'; btnEl.appendChild(inputEl); }
      // The backend either found an existing folder (matched by Name+Mobile) or
      // created a fresh one — either way, persist that folder ID back to the
      // sheet immediately (matched by Record ID, or mobile as fallback for leads/
      // legacy rows), so it's tagged right away rather than relying on the
      // advisor's app to discover and tag it on a later visit. Cheap and safe to
      // call even if it was already tagged — it just overwrites with the same value.
      if(res.folderId && res.folderId !== client.folderId){
        client.folderId = res.folderId;
        var tagAction = client.recordType==='lead' ? 'tagLeadFolder' : 'tagClientFolder';
        apiPost({ action: tagAction, mobile: client.mobile, recordId: client.recordId||'', folderId: res.folderId }).catch(function(){});
      }
    } else {
      // Surface the ACTUAL error (network/timeout/server) instead of a generic
      // message — this is what makes an intermittent failure diagnosable
      // instead of just "upload failed, try again" with no further information.
      showUploadRetry(statusEl, rowEl, safeId, res && res.error ? res.error : 'Unknown error', base64, file.type, ext, docType);
    }
  }catch(e){
    showUploadRetry(statusEl, rowEl, safeId, e.message||'Could not read the file', null, file.type, null, docType);
  }
  inputEl.value = '';
}

// Shown on any upload failure — displays the real error and offers a one-tap
// retry that reuses the already-encoded file data, so the client doesn't have
// to re-pick the file from their gallery/files app if it was just a transient
// network hiccup (which "server not found"-type reports usually are).
function showUploadRetry(statusEl, rowEl, safeId, errMsg, base64, mimeType, ext, docType){
  if(rowEl) rowEl.className = 'slot err';
  if(!statusEl) return;
  statusEl.innerHTML = 'Upload failed: '+esc(errMsg)
    + (base64 ? ' <a href="#" id="retry-'+safeId+'" style="color:var(--accent);font-weight:700">Retry</a>' : ' (please choose the file again)');
  if(base64){
    var retryLink=document.getElementById('retry-'+safeId);
    if(retryLink){
      retryLink.onclick=async function(e){
        e.preventDefault();
        statusEl.innerHTML = '<span class="spin"></span>Retrying…';
        if(rowEl) rowEl.className = 'slot';
        try{
          var res=await apiPost({
            action:'uploadClientDocument',
            clientName: client.name, pan: client.pan||'', mobile: client.mobile, folderId: client.folderId||'',
            docType: docType, fileData: base64, mimeType: mimeType, fileExt: ext
          }, 25000);
          if(res && res.success){
            statusEl.textContent = '✅ Uploaded';
            if(rowEl) rowEl.className = 'slot done';
            if(res.folderId) client.folderId = res.folderId;
          } else {
            showUploadRetry(statusEl, rowEl, safeId, res && res.error ? res.error : 'Unknown error', base64, mimeType, ext, docType);
          }
        }catch(e2){
          showUploadRetry(statusEl, rowEl, safeId, e2.message||'Still could not reach the server', base64, mimeType, ext, docType);
        }
      };
    }
  }
}
function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

async function saveNominee(){
  var name=(document.getElementById('nom-name').value||'').trim();
  var mobile=(document.getElementById('nom-mobile').value||'').trim();
  var email=(document.getElementById('nom-email').value||'').trim();
  var accNum=(document.getElementById('bank-acc').value||'').trim();
  var ifsc=(document.getElementById('bank-ifsc').value||'').trim();
  var msgEl=document.getElementById('nomMsg');
  var btn=document.getElementById('nomSaveBtn');

  var hasNominee = name || mobile || email;
  var hasBank = accNum || ifsc;
  if(!hasNominee && !hasBank){ msgEl.textContent='Please fill in nominee and/or bank details.'; msgEl.className='savemsg err'; return; }
  if(name && mobile && mobile.length!==10){ msgEl.textContent='Mobile number must be exactly 10 digits.'; msgEl.className='savemsg err'; return; }
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ msgEl.textContent='Please enter a valid email address.'; msgEl.className='savemsg err'; return; }
  if(hasBank && (!accNum || !ifsc)){ msgEl.textContent='Please enter both account number and IFSC code.'; msgEl.className='savemsg err'; return; }
  if(ifsc && !/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc)){ msgEl.textContent='IFSC code looks incorrect — check and try again.'; msgEl.className='savemsg err'; return; }

  btn.disabled=true; msgEl.textContent='Saving…'; msgEl.className='savemsg';
  // Nominee and bank details are combined into ONE file in the client's
  // folder, rather than two separate files.
  var res = await apiPost({
    action:'saveNomineeAndBankDetails',
    clientName: client.name, pan: client.pan||'', mobile: client.mobile, folderId: client.folderId||'',
    nomineeName: name, nomineeMobile: mobile, nomineeEmail: email,
    accountNumber: accNum, ifscCode: ifsc
  }, 20000);
  btn.disabled=false;
  if(res && res.success){
    msgEl.textContent='✅ Details saved.'; msgEl.className='savemsg ok';
    if(res.folderId) client.folderId = res.folderId;
  } else {
    msgEl.textContent='Could not save: '+esc(res&&res.error?res.error:'please try again'); msgEl.className='savemsg err';
  }
}

async function init(){
  var token = qs('id');
  if(!token){
    renderError('Invalid link', 'This upload link is missing information. Please ask your advisor to resend it.');
    return;
  }
  try{
    var r = await fetch(SCRIPT_URL + '?action=resolveUploadToken&token=' + encodeURIComponent(token) + '&t=' + Date.now());
    var j = await r.json();
    if(j && j.found){
      client = { name:j.name, mobile:j.mobile, pan:j.pan, folderId:j.folderId||'', recordId:j.recordId||'', recordType:j.recordType||'client' };
      renderSlots();
      markExistingUploads();
    } else {
      renderError('Link not found', 'This link is invalid or has expired. Please contact your advisor for a new one.');
    }
  }catch(e){
    renderError('Connection problem', 'Could not reach the server. Please check your internet connection and reopen this link.');
  }
}

init();
</script>
</body>
</html>
